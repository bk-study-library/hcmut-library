name: validate

on:
  push:
    branches: [main]
  pull_request:

# Token của CI không có quyền gì; job chỉ xin quyền đọc mã nguồn để checkout.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test (validator, importer, site generator)
        run: npm test
      - name: Validate catalog and items, check generated files are current
        run: npm run validate
      - name: Build the site (smoke test)
        run: npm run site -- --out "$RUNNER_TEMP/site"

  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Test (kiểm bài gửi của Worker)
        run: npm ci && npm test
