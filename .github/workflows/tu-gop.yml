name: tu-gop

# Duyệt một phần trên trang duyệt: Worker bỏ file không duyệt khỏi branch upload/<mã>, kiem-file dựng
# lại generated file và commit "kiem-file: ...", validate chạy lại. Khi validate qua, workflow này báo
# Worker (POST /duyet-tiep). Worker tự kiểm lại mọi điều kiện (đã có quyết định của người duyệt, PR
# còn mở, check của đầu branch đã qua, commit đầu là của kiem-file, mục trên branch đúng danh sách
# được duyệt) rồi mới merge, nên workflow không cần token hay secret nào.

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions: {}

jobs:
  bao-worker:
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'upload/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: catalog/site.json
          sparse-checkout-cone-mode: false
      - name: Báo Worker merge bài đã duyệt
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          code="${HEAD_BRANCH#upload/}"
          if ! printf '%s' "$code" | grep -Eq '^[A-Za-z0-9]{10}$'; then exit 0; fi
          base=$(node -e "process.stdout.write(String(require('./catalog/site.json').reviewBase || ''))")
          if [ -z "$base" ]; then exit 0; fi
          curl -fsS -m 30 -X POST "$base/duyet-tiep" -H 'Content-Type: application/json' --data "{\"code\":\"$code\"}"
