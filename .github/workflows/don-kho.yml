name: don-kho

# Dọn kho cách ly R2 và nhánh khi PR của bài gửi bị đóng mà không merge.
# Logic nằm ở scripts/upload/publish.mjs.
#
# Mô hình đe dọa. pull_request_target chạy với quyền ghi, nên workflow và script lấy từ main,
# không bao giờ checkout hay chạy mã của nhánh PR. Chỉ chạy khi PR cùng repo, nhánh upload/*
# và do bot mở. Tên nhánh đi qua env và được kiểm dạng upload/<mã 10 ký tự> trước khi dùng
# làm đường dẫn R2 hay tên nhánh cần xóa, nên không xóa được gì ngoài upload/*.
# File gốc tải từ R2 chỉ bị tính hash. Khóa R2 chỉ nằm trong env của bước cần chúng.
#
# Dọn: pending/<mã>/, clean/<mã>/, mã xem bài token/<mã>, khóa sha/<sha256 file gốc> (tính từ
# pending/ nếu còn; đã bị luật vòng đời xóa thì bỏ qua), rồi nhánh upload/<mã>. Chạy lại an toàn.
# Sách tham khảo không file thì không có gì trong kho: bỏ qua R2, chỉ xóa nhánh. Chỉ bỏ qua
# khi chắc chắn (PR đúng một mục book-ref không file); PR lạ hay đọc lỗi thì dọn như thường.
# Nhánh PR chỉ được đọc làm dữ liệu.
#
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY.
# Variables: R2_BUCKET, BOT_LOGIN.

on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: don-kho-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  don-kho:
    timeout-minutes: 10
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'upload/') &&
      vars.BOT_LOGIN != '' &&
      github.event.pull_request.user.login == vars.BOT_LOGIN
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Kiểm tên nhánh
        id: code
        run: node scripts/upload/publish.mjs code --branch "$BRANCH" --output-file "$GITHUB_OUTPUT"
      - name: Checkout dữ liệu của PR (không chạy mã trong này)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Xem bài có file trong kho không
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | {filename, status, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl" || true
          node scripts/upload/publish.mjs kind --files "$RUNNER_TEMP/files.jsonl" --root pr \
            --branch "$BRANCH" --output-file "$GITHUB_OUTPUT"
      - name: Tải file cách ly gốc để tính khóa sha
        if: steps.kind.outputs.light != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.code.outputs.code }}
        run: |
          mkdir -p "$RUNNER_TEMP/pending"
          aws s3 cp "s3://$R2_BUCKET/pending/$CODE/" "$RUNNER_TEMP/pending/" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - name: Tính sha256 của file gốc
        id: sha
        if: steps.kind.outputs.light != 'true'
        run: node scripts/upload/publish.mjs pending-sha --dir "$RUNNER_TEMP/pending" --output-file "$GITHUB_OUTPUT"
      # Email báo kết quả (không bắt buộc): Worker tự hỏi GitHub trạng thái PR rồi gửi qua Resend và
      # xóa email. Lỗi gửi không làm hỏng workflow; email vẫn bị xóa ở bước sau.
      - name: Báo kết quả qua email nếu người gửi có để lại
        continue-on-error: true
        env:
          CODE: ${{ steps.code.outputs.code }}
        run: |
          base=$(node -e "process.stdout.write(String(require('./catalog/site.json').reviewBase || ''))")
          if [ -z "$base" ] || [ -z "$CODE" ]; then exit 0; fi
          curl -fsS -m 30 -X POST "$base/bao-ket-qua" -H 'Content-Type: application/json' --data "{\"code\":\"$CODE\"}"
      - name: Xóa email báo kết quả khỏi kho cách ly
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.code.outputs.code }}
        run: |
          if [ -z "$CODE" ]; then exit 0; fi
          aws s3 rm "s3://$R2_BUCKET/notify/$CODE" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - name: Xóa file trong kho cách ly
        if: steps.kind.outputs.light != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.code.outputs.code }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://$R2_BUCKET/pending/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/clean/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/token/$CODE" --endpoint-url "$endpoint" --only-show-errors
          if [ -n "$SHA" ]; then
            aws s3 rm "s3://$R2_BUCKET/sha/$SHA" --endpoint-url "$endpoint" --only-show-errors
          fi
      # Chỉ xóa nhánh upload/<mã> đã kiểm dạng ở bước đầu. Nhánh đã mất thì coi như xong.
      - name: Xóa nhánh
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_BRANCH: ${{ steps.code.outputs.branch }}
        run: |
          if ! out=$(gh api -X DELETE "repos/$REPO/git/refs/heads/$UPLOAD_BRANCH" 2>&1); then
            case "$out" in
              *"Reference does not exist"*|*"HTTP 404"*) echo "Nhánh $UPLOAD_BRANCH đã không còn." ;;
              *) echo "$out" >&2; exit 1 ;;
            esac
          fi
