name: kiem-file

# Kiểm file của bài gửi qua form: tải từ bucket quarantine trên R2, quét virus (cả bên trong
# file nén, báo file mã hóa hay vượt giới hạn quét), làm sạch siêu dữ liệu (PDF,
# ảnh, Office), tìm JavaScript trong PDF, macro trong Office, mục lạ trong .zip,
# tìm lớp chữ và thông tin cá nhân, comment kết quả, rồi ghi link Release vào branch
# của PR. Logic nằm ở scripts/upload/check.mjs và scripts/upload/sanitize.mjs.
#
# Mô hình đe dọa. pull_request_target chạy với quyền ghi. Có hai thứ không tin được:
# nội dung branch PR, và file người dùng tải lên (có thể nhắm vào lỗ hổng của
# clamscan, exiftool, qpdf, pdftotext). Vì vậy:
# - Không bao giờ chạy mã của branch PR. Script lấy từ main (thư mục trusted), branch
#   PR chỉ là dữ liệu (thư mục pr). Không chạy npm install hay npm script trong pr.
# - Mỗi job chỉ giữ đúng quyền và khóa nó cần:
#   gate   (contents: read, pull-requests: read)  bỏ qua commit của chính workflow, tìm item,
#                            kiểm PR chỉ sửa mục đó, generated file của môn đó và file môn mới (nếu có).
#   fetch  (contents: read, khóa R2)  tải file cách ly và item, đưa lên artifact.
#   scan   (contents: read, không khóa, không token ghi)  bước duy nhất chạy công cụ
#                            trên file tải lên; ghi kết quả và bản đã sanitize lên artifact.
#   apply  (contents: read, pull-requests: write, khóa R2, token App để push)  coi artifact
#                            của scan là dữ liệu: kiểm dạng từng trường, tính lại sha256
#                            của bản đã sanitize, không chạy gì từ artifact, không chạy lại công cụ.
#   apply-sach (contents: read, pull-requests: write, token App để push)  sách tham khảo
#                            không có file: bỏ fetch, scan, R2; chỉ dựng lại generated file,
#                            commit và comment ngắn.
#   report-failure (pull-requests: write)  job nào lỗi thì sửa comment báo không kiểm được.
# - Khóa chỉ nằm trong env của bước cần chúng.
#
# Có virus: comment, đóng PR bằng token của App (để don-kho chạy và xóa branch), xóa
# file và mã xem bài trong kho rồi dừng. Job vẫn thành công, PR bị đóng chính là kết quả.
#
# Máy không kết luận được (ClamAV không quét hết, PDF có JavaScript, Office có macro,
# .zip có mục lạ): báo trong comment và gắn label can-xem-tay, không tự đóng PR.
# Người duyệt xem tay rồi quyết định.
#
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (khóa R2 đọc,
# ghi, xóa bucket bucket quarantine); GH_APP_CLIENT_ID (Client ID của GitHub App,
# trang cài đặt của App, dạng Iv...); GH_APP_PRIVATE_KEY (file .pem của App).
# Variables: R2_BUCKET (tên bucket), BOT_LOGIN (tên bot mở PR, ví dụ
# bk-study-library-bot[bot]).

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: kiem-file-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.event.pull_request.head.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  gate:
    timeout-minutes: 10
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'upload/') &&
      contains(github.event.pull_request.labels.*.name, 'tai-lieu-moi') &&
      (github.event.action != 'labeled' || github.event.label.name == 'tai-lieu-moi') &&
      vars.BOT_LOGIN != '' &&
      github.event.pull_request.user.login == vars.BOT_LOGIN
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.head.outputs.run }}
      item: ${{ steps.locate.outputs.item }}
      light: ${{ steps.locate.outputs.light }}
      course: ${{ steps.locate.outputs.course }}
      code: ${{ steps.locate.outputs.code }}
      key: ${{ steps.locate.outputs.key }}
      name: ${{ steps.locate.outputs.name }}
      sha256: ${{ steps.locate.outputs.sha256 }}
      # Đợt gửi nhiều file: danh sách mục (JSON) và số mục, để các job sau lặp qua từng file.
      manifest: ${{ steps.locate.outputs.manifest }}
      count: ${{ steps.locate.outputs.count }}
      # Mọi file đã quét xong (người duyệt vừa bỏ bớt file): bỏ qua fetch, scan, apply; chỉ dựng lại generated file.
      items: ${{ steps.locate.outputs.items }}
      rebuild: ${{ steps.locate.outputs.rebuild }}
    steps:
      # Bỏ qua khi commit mới nhất là commit của chính workflow này (tránh tự gọi lại).
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
          case "$msg" in
            kiem-file:*) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.head.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - if: steps.head.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - if: steps.head.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # PR chỉ được có một item và generated file của môn đó; sai thì dừng trước khi đụng R2.
      - name: Tìm item trong PR
        id: locate
        if: steps.head.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export CHECK_ERROR_FILE="$RUNNER_TEMP/loi/loi-gate.txt"
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | {filename, status, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl"
          node trusted/scripts/upload/check.mjs locate --files "$RUNNER_TEMP/files.jsonl" --pr pr \
            --branch "$BRANCH" --repo "$REPO" --output-file "$GITHUB_OUTPUT"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loi-gate
          path: ${{ runner.temp }}/loi/
          if-no-files-found: ignore
          retention-days: 1

  fetch:
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.light == 'false' && needs.gate.outputs.rebuild != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Mỗi mục một thư mục in/<chỉ số>/: item.json và file/<tên>. Khóa và tên đã qua kiểm ở job gate.
      - name: Lấy các item và file từ bucket quarantine
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ needs.gate.outputs.manifest }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          printf '%s' "$MANIFEST" | jq -r 'to_entries[] | select(.value.light == "false") | [.key, .value.key, .value.name, .value.item] | @tsv' > "$RUNNER_TEMP/list.tsv"
          while IFS=$'\t' read -r i key name item; do
            mkdir -p "$RUNNER_TEMP/in/$i/file"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/contents/$item?ref=$HEAD_SHA" > "$RUNNER_TEMP/in/$i/item.json"
            aws s3 cp "s3://$R2_BUCKET/$key" "$RUNNER_TEMP/in/$i/file/$name" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors || {
              mkdir -p "$RUNNER_TEMP/loi"
              echo "Không tải được file $name từ bucket quarantine. File có thể đã bị xóa sau 30 ngày. Bạn hãy gửi lại bài." > "$RUNNER_TEMP/loi/loi-fetch.txt"
              exit 1
            }
          done < "$RUNNER_TEMP/list.tsv"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiem-file-goc
          path: ${{ runner.temp }}/in/
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loi-fetch
          path: ${{ runner.temp }}/loi/
          if-no-files-found: ignore
          retention-days: 1

  # Không có secret, chỉ quyền đọc: file tải lên có phá được công cụ thì cũng không lấy được gì.
  scan:
    timeout-minutes: 15
    needs: [gate, fetch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Cài công cụ kiểm file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam libimage-exiftool-perl qpdf poppler-utils
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kiem-file-goc
          path: ${{ runner.temp }}/in
      - name: Kiểm file
        run: |
          export CHECK_ERROR_FILE="$RUNNER_TEMP/loi/loi-scan.txt"
          # clamscan một lần cho mọi file của bài: nạp cơ sở dữ liệu ClamAV một lần thay vì mỗi file một lần.
          node trusted/scripts/upload/check.mjs clamscan-all --root "$RUNNER_TEMP/in" --out "$RUNNER_TEMP/clam.json"
          for d in "$RUNNER_TEMP"/in/*/; do
            i=$(basename "$d")
            node trusted/scripts/upload/check.mjs scan --item "$d/item.json" \
              --dir "$d/file" --out "$RUNNER_TEMP/out/$i" --clam "$RUNNER_TEMP/clam.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kiem-file-ket-qua
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loi-scan
          path: ${{ runner.temp }}/loi/
          if-no-files-found: ignore
          retention-days: 1

  apply:
    timeout-minutes: 10
    needs: [gate, scan]
    runs-on: ubuntu-latest
    # Push dùng token App, nên github.token chỉ cần đọc repo, comment và đóng PR.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      virus: ${{ steps.apply.outputs.virus }}
      manual: ${{ steps.apply.outputs.manual }}
    env:
      CHECK_ERROR_FILE: ${{ github.workspace }}/loi/loi-apply.txt
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout dữ liệu của PR (không chạy mã trong này)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kiem-file-ket-qua
          path: ${{ runner.temp }}/res

      - name: Ghi kết quả vào các item
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ needs.gate.outputs.manifest }}
        run: |
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/manifest.json"
          node trusted/scripts/upload/check.mjs apply-batch --manifest "$RUNNER_TEMP/manifest.json" --pr pr \
            --res-dir "$RUNNER_TEMP/res" --repo "$REPO" --report "$RUNNER_TEMP/report.md" \
            --pairs "$RUNNER_TEMP/pairs.tsv" --auto-file "$RUNNER_TEMP/auto.json" --output-file "$GITHUB_OUTPUT"
          {
            echo "items<<ITEMS_EOF"
            jq -r '.[].item' "$RUNNER_TEMP/manifest.json"
            echo "ITEMS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment kết quả
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/upload/check.mjs comment --repo "$REPO" --pr "$PR" --body-file "$RUNNER_TEMP/report.md"

      # Máy không kết luận được: gắn label để người duyệt xem tay. Nhãn can-xem-tay phải có sẵn trong repo.
      - name: Gắn nhãn cần xem tay
        if: always() && steps.apply.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$REPO/issues/$PR/labels" -f "labels[]=can-xem-tay" --silent

      # Đóng PR bằng token của App: sự kiện do GITHUB_TOKEN tạo không chạy workflow khác, còn đóng
      # bằng App thì don-kho chạy và xóa branch upload/<mã>.
      - name: Tạo token của GitHub App để đóng PR có virus
        if: always() && steps.apply.outputs.virus != ''
        id: virus-app
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Có virus thì đóng PR và xóa file trong kho
        # Chạy cả khi bước comment lỗi: PR có virus vẫn phải đóng và kho phải sạch.
        # Không có token App thì đóng bằng GITHUB_TOKEN (don-kho không chạy, branch còn lại).
        if: always() && steps.apply.outputs.virus != ''
        env:
          GH_TOKEN: ${{ steps.virus-app.outputs.token || github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ needs.gate.outputs.code }}
          MANIFEST: ${{ needs.gate.outputs.manifest }}
        run: |
          gh pr close "$PR" --repo "$REPO"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://$R2_BUCKET/pending/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/clean/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/token/$CODE" --endpoint-url "$endpoint" --only-show-errors
          for sha in $(printf '%s' "$MANIFEST" | jq -r '.[].sha256 | select(test("^[0-9a-f]{64}$"))'); do
            aws s3 rm "s3://$R2_BUCKET/sha/$sha" --endpoint-url "$endpoint" --only-show-errors
          done

      - name: Đưa bản đã sanitize về bucket quarantine
        if: steps.apply.outputs.virus == ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          while IFS=$'\t' read -r clean quarantine; do
            aws s3 cp "$clean" "s3://$R2_BUCKET/$quarantine" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
          done < "$RUNNER_TEMP/pairs.tsv"

      # Kiểm không qua thì lý do (chỉ dòng LỖI) vào loi-apply để comment nêu rõ.
      - name: Dựng lại generated file trong branch PR
        if: steps.apply.outputs.virus == ''
        run: node trusted/scripts/upload/check.mjs rebuild --root pr

      - name: Tạo token của GitHub App
        if: steps.apply.outputs.virus == ''
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # Bản này nhận client-id (app-id đã cũ). Secret chứa Client ID của App.
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      # Chỉ commit item và generated file của môn đó, push bằng token của App.
      - name: Commit link Release vào branch PR
        if: steps.apply.outputs.virus == ''
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CODE: ${{ needs.gate.outputs.code }}
          ITEMS: ${{ steps.apply.outputs.items }}
          COURSE: ${{ needs.gate.outputs.course }}
        run: bash ../trusted/scripts/upload/commit-pr.sh
      # Phân loại (scripts/upload/triage.mjs): bài không cần người duyệt thì ghi quyết định vào R2, cron của Worker
      # merge khi check qua. Bài cần người duyệt hay Chưa phân loại thì gắn label; cần người duyệt thì yêu cầu review
      # (người duyệt do check.mjs tra trong .github/CODEOWNERS; comment kết quả đã nhắc tên họ khi Chưa phân loại).
      - name: Tự merge khi check qua
        if: steps.apply.outputs.virus == '' && steps.apply.outputs.decision != 'review'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ needs.gate.outputs.code }}
        run: |
          aws s3 cp "$RUNNER_TEMP/auto.json" "s3://$R2_BUCKET/review/$CODE.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - name: Gọi người duyệt
        if: steps.apply.outputs.virus == '' && steps.apply.outputs.decision != 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.apply.outputs.decision }}
          REVIEWERS: ${{ steps.apply.outputs.reviewers }}
        run: |
          label=chua-phan-loai
          if [ "$DECISION" = review ]; then label=can-duyet; fi
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" > /dev/null
          [ "$DECISION" = review ] || exit 0
          args=()
          for who in $REVIEWERS; do
            case "$who" in
              */*) args+=(-f "team_reviewers[]=${who#*/}") ;;
              *) args+=(-f "reviewers[]=$who") ;;
            esac
          done
          if [ ${#args[@]} -gt 0 ]; then gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" "${args[@]}" > /dev/null; fi
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loi-apply
          path: ${{ github.workspace }}/loi/
          if-no-files-found: ignore
          retention-days: 1

  # Sách tham khảo không file: không có gì để tải hay quét, không đụng R2, không có khóa R2.
  apply-sach:
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.run == 'true' && (needs.gate.outputs.light == 'true' || needs.gate.outputs.rebuild == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CHECK_ERROR_FILE: ${{ github.workspace }}/loi/loi-sach.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout dữ liệu của PR (không chạy mã trong này)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dựng lại generated file trong branch PR
        run: node trusted/scripts/upload/check.mjs rebuild --root pr
      - name: Tạo token của GitHub App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit generated file vào branch PR
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CODE: ${{ needs.gate.outputs.code }}
          ITEMS: ${{ needs.gate.outputs.items }}
          COURSE: ${{ needs.gate.outputs.course }}
        run: bash ../trusted/scripts/upload/commit-pr.sh
      - name: Comment kết quả
        if: needs.gate.outputs.light == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ needs.gate.outputs.code }}
        run: |
          node trusted/scripts/upload/check.mjs book-report --code "$CODE" > "$RUNNER_TEMP/report.md"
          node trusted/scripts/upload/check.mjs comment --repo "$REPO" --pr "$PR" --body-file "$RUNNER_TEMP/report.md"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loi-sach
          path: ${{ github.workspace }}/loi/
          if-no-files-found: ignore
          retention-days: 1

  # Lỗi sau khi đã báo có virus thì giữ nguyên comment báo virus.
  report-failure:
    timeout-minutes: 10
    needs: [gate, fetch, scan, apply, apply-sach]
    if: always() && contains(needs.*.result, 'failure') && needs.apply.outputs.virus == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: loi-*
          merge-multiple: true
          path: ${{ runner.temp }}/loi
      - name: Báo không kiểm được
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node trusted/scripts/upload/check.mjs failure --run-url "$RUN_URL" --reason-dir "$RUNNER_TEMP/loi" > "$RUNNER_TEMP/failure.md"
          node trusted/scripts/upload/check.mjs comment --repo "$REPO" --pr "$PR" --body-file "$RUNNER_TEMP/failure.md"
