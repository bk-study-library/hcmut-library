name: phat-hanh-file

# Phát hành file của bài gửi qua form khi người duyệt merge PR, và xóa file trên
# Release khi một mục tài liệu chuyển sang removed. Logic nằm ở scripts/upload/publish.mjs.
#
#   phat-hanh  (pull_request_target closed, đã merge)  tải bản đã làm sạch từ kho cách ly R2,
#              kiểm sha256 và kích thước theo mục tài liệu, đưa lên Release (pre-release nếu
#              chưa có), rồi xóa pending/, clean/, mã xem bài token/ và khóa sha/ trong kho.
#              Sách tham khảo không file (locate ghi light=true) thì không có gì để phát hành
#              hay dọn: các bước sau đều bỏ qua.
#              Chạy tay (workflow_dispatch, ô item = courses/<MÃ>/items/<id>.json trên main): cùng các
#              bước trên cho một mục đã merge mà lần phát hành trước lỗi, đọc mục ở HEAD của main.
#              Release đích là immutable release thì dừng ngay ở bước lập kế hoạch và chỉ cách sửa.
#   go-file    (push vào main, đổi courses/**/items/*.json)  mục vừa chuyển sang removed, hoặc file
#              mục bị xóa hẳn, thì xóa file tương ứng trên Release của repo (trừ khi mục còn hiệu lực
#              khác vẫn dùng); link ngoài bỏ qua. validate.yml cũng báo lỗi ITEM_DELETED khi xóa file mục.
#
# Mô hình đe dọa. pull_request_target chạy với quyền ghi. Workflow và script lấy từ main,
# không bao giờ checkout hay chạy mã của nhánh PR. Chỉ chạy khi PR cùng repo, nhánh upload/*
# và do bot mở. Mục tài liệu đọc từ main sau khi merge. File tải từ R2 chỉ bị tính hash và
# đưa lên Release, không bị chạy. Khóa R2 chỉ nằm trong env của bước cần chúng; mọi giá trị
# chưa tin được (tên nhánh, tên file) đi qua env, không đặt trong lệnh run.
# Chạy tay: GitHub chỉ cho người có quyền ghi repo bấm workflow_dispatch, và job chỉ chạy khi
# chọn nhánh main (workflow và script là bản trên main). Ô item vẫn coi là chưa tin được: đi
# qua env, publish.mjs dispatch-locate kiểm bằng regex, file phải là file thường có trên main,
# đúng course và id, chưa gỡ, do bot tải lên (có khóa clean/<mã bài>/<tên> trong kho cách ly).
#
# Chạy lại an toàn: file đã có trên Release cùng sha256 thì bỏ qua; cùng tên khác sha256 thì
# dừng và báo lỗi. Dọn kho xóa cả khi file đã mất.
#
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (khóa R2 đọc, ghi, xóa bucket
# kho cách ly). Variables: R2_BUCKET (tên bucket), BOT_LOGIN (tên bot mở PR).

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]
    paths:
      - 'courses/**/items/*.json'
  workflow_dispatch:
    inputs:
      item:
        description: 'Mục tài liệu cần phát hành lại, đường dẫn trên main dạng courses/<MÃ>/items/<id>.json'
        required: true
        type: string

permissions: {}

concurrency:
  # Mỗi lần push một nhóm riêng để không bị hủy giữa chừng; unpublish chạy lại được nên chạy song song cũng an toàn.
  # Chạy tay có nhóm riêng theo commit của main, không lẫn với lần push cùng commit.
  group: phat-hanh-file-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  phat-hanh:
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'upload/') &&
      vars.BOT_LOGIN != '' &&
      github.event.pull_request.user.login == vars.BOT_LOGIN)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # Bản main sau khi merge (chạy tay: HEAD hiện tại của main): script và mục tài liệu đều đọc từ đây.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Ghi item, code, light và branch (upload/<mã bài>) cho các bước sau, theo PR hoặc theo ô item khi chạy tay.
      - name: Tìm mục tài liệu
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ITEM_INPUT: ${{ inputs.item }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            node scripts/upload/publish.mjs dispatch-locate --item "$ITEM_INPUT" --root . --output-file "$GITHUB_OUTPUT"
          else
            gh api --paginate "repos/$REPO/pulls/$PR/files" \
              --jq '.[] | {filename, status, previous_filename} | @json' > "$RUNNER_TEMP/files.jsonl"
            node scripts/upload/publish.mjs locate --files "$RUNNER_TEMP/files.jsonl" --root . \
              --branch "$BRANCH" --output-file "$GITHUB_OUTPUT"
          fi
      # Cũng kiểm sớm Release đích: immutable release thì dừng ở đây, trước khi tải gì từ kho cách ly.
      # Mọi mục của đợt gửi (chạy tay thì một mục). Kiểm sớm mọi Release đích trước khi tải gì từ kho.
      - name: Lập kế hoạch phát hành
        id: plan
        if: steps.locate.outputs.light == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ITEMS: ${{ steps.locate.outputs.items || steps.locate.outputs.item }}
          BRANCH: ${{ steps.locate.outputs.branch }}
        run: >-
          node scripts/upload/publish.mjs plan-batch --items "$ITEMS" --root . --branch "$BRANCH" --repo "$REPO"
          --plan-file "$RUNNER_TEMP/plan.tsv" --output-file "$GITHUB_OUTPUT"

      # Từng file: tải bản đã làm sạch, kiểm sha256 và kích thước, rồi đưa lên Release (chưa có thì tạo
      # pre-release; hai bài cùng học kỳ tạo cùng lúc thì đọc lại). Tag, tên, khóa đã qua kiểm ở bước trên.
      - name: Tải, kiểm và đưa các file lên Release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          while IFS=$'\t' read -r tag name quarantine sha256 size; do
            aws s3 cp "s3://$R2_BUCKET/$quarantine" "$RUNNER_TEMP/dl/$name" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
            node scripts/upload/publish.mjs verify --file "$RUNNER_TEMP/dl/$name" --sha256 "$sha256" --size "$size"
            if ! gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
              gh release create "$tag" --repo "$REPO" --prerelease --title "$tag" \
                --notes "File tài liệu của thư viện, do workflow phat-hanh-file đưa lên." ||
                gh release view "$tag" --repo "$REPO" > /dev/null
            fi
            gh release upload "$tag" "$RUNNER_TEMP/dl/$name" --repo "$REPO"
          done < "$RUNNER_TEMP/plan.tsv"

      # Dọn kho chỉ chạy khi các bước trên thành công (kể cả khi file đã có sẵn trên Release).
      # Khóa sha/ đặt theo sha256 của file gốc, mục tài liệu chỉ có sha256 bản sạch, nên tính lại
      # từ pending/ nếu còn; đã bị luật vòng đời xóa thì không còn gì để tính.
      - name: Tải file cách ly gốc để tính khóa sha
        if: steps.locate.outputs.light == 'false'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.locate.outputs.code }}
        run: |
          mkdir -p "$RUNNER_TEMP/pending"
          aws s3 cp "s3://$R2_BUCKET/pending/$CODE/" "$RUNNER_TEMP/pending/" --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - name: Tính sha256 của file gốc
        id: sha
        if: steps.locate.outputs.light == 'false'
        run: node scripts/upload/publish.mjs pending-sha --dir "$RUNNER_TEMP/pending" --output-file "$GITHUB_OUTPUT"
      # Email báo kết quả (không bắt buộc): Worker tự hỏi GitHub trạng thái PR rồi gửi qua Resend và
      # xóa email. Lỗi gửi không làm hỏng workflow; email vẫn bị xóa ở bước sau.
      - name: Báo kết quả qua email nếu người gửi có để lại
        continue-on-error: true
        env:
          CODE: ${{ steps.locate.outputs.code }}
        run: |
          base=$(node -e "process.stdout.write(String(require('./catalog/site.json').reviewBase || ''))")
          if [ -z "$base" ] || [ -z "$CODE" ]; then exit 0; fi
          curl -fsS -m 30 -X POST "$base/bao-ket-qua" -H 'Content-Type: application/json' --data "{\"code\":\"$CODE\"}"
      - name: Xóa email báo kết quả khỏi kho cách ly
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.locate.outputs.code }}
        run: |
          if [ -z "$CODE" ]; then exit 0; fi
          aws s3 rm "s3://$R2_BUCKET/notify/$CODE" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
      - name: Xóa file trong kho cách ly
        if: steps.locate.outputs.light == 'false'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CODE: ${{ steps.locate.outputs.code }}
          SHAS: ${{ steps.sha.outputs.shas }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 rm "s3://$R2_BUCKET/pending/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/clean/$CODE/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 rm "s3://$R2_BUCKET/token/$CODE" --endpoint-url "$endpoint" --only-show-errors
          for sha in $SHAS; do
            case "$sha" in *[!0-9a-f]*|"") continue ;; esac
            aws s3 rm "s3://$R2_BUCKET/sha/$sha" --endpoint-url "$endpoint" --only-show-errors
          done
      - name: Hướng dẫn khi phát hành lỗi
        if: failure()
        run: |
          msg="Phát hành file lỗi. Xem bước lỗi ở trên. Nếu file trùng tên khác nội dung hoặc Release không có digest: đổi tên file trong mục tài liệu trên main (sửa name, url, quarantine cho khớp) rồi chạy lại workflow này. Nếu Release là immutable release hoặc GitHub báo tag đã thuộc một immutable release: tắt Immutable releases trong Settings của repo, đặt tag mới trong releaseTagOverrides của catalog/policy.json, sửa url của mục, chạy npm run build, merge vào main, rồi chạy tay workflow này với ô item (xem docs/cai-dat-luong-tai-len.md, mục Release). File trong pending/ và clean/ của kho cách ly được giữ 30 ngày."
          echo "::error::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  go-file:
    timeout-minutes: 10
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Cần đủ lịch sử để đọc bản trước của mục tài liệu theo github.event.before.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Xóa file của mục vừa gỡ trên Release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/upload/publish.mjs unpublish --before "$BEFORE" --after "$AFTER" --repo "$REPO"
